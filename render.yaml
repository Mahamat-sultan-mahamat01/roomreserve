services:
  - type: web
    name: roomreservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomreservation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: "False"
      
databases:
  - name: roomreserve-db
    plan: true
    databaseName: roomreserve
    user: roomreserve

