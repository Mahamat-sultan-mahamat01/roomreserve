services:
  - type: web
    name: roomreservation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: ./entrypoint.sh
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roomreserve-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: "False"

databases:
  - name: roomreserve-db
    plan: free
    databaseName: roomreserve
    user: roomreserve
