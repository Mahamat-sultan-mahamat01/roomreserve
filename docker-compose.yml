services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roomreserve
      POSTGRES_USER: roomreserve
      POSTGRES_PASSWORD: roomreserve
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomreserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: roomreserve
      POSTGRES_USER: roomreserve
      POSTGRES_PASSWORD: roomreserve
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: